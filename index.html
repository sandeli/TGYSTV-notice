<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TGYS TV · 公告发布</title>
<style>
body{margin:0;background:#0B1426;color:#E6EDF7;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:22px;margin:0 0 4px}h1 b{color:#F97316}
.sub{color:#8A9BB8;font-size:13px;margin:0 0 18px}
label{display:block;margin:16px 0 6px;font-size:14px}
input,textarea{box-sizing:border-box;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #24385E;background:#13203A;color:#E6EDF7;font-size:16px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px}
.row input{width:auto;transform:scale(1.4)}
button{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#F97316;color:#fff;font-size:17px}
button.ghost{background:#1B2B4B}
.preview{margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;overflow:hidden;white-space:nowrap;font-size:15px}
.preview span.tag{background:#F97316;color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:bold;margin-right:10px}
.preview .run{display:inline-block;padding-left:100%;animation:run 14s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
#msg{margin-top:14px;font-size:14px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34D399}.bad{color:#F87171}.muted{color:#8A9BB8;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>TGYS <b>TV</b> · 公告发布</h1>
  <p class="sub">保存后，电视端每次启动 App 时读取，显示在首页「热门电影」上方的跑马灯里。</p>

  <label for="text">公告内容</label>
  <textarea id="text" placeholder="例如：今晚 22:00 起维护半小时"></textarea>

  <label for="more">更多公告（可选，每行一条，依次滚动）</label>
  <textarea id="more" style="min-height:70px"></textarea>

  <div class="row"><input type="checkbox" id="enabled" checked><label for="enabled" style="margin:0">显示公告（取消勾选即隐藏）</label></div>

  <div class="preview"><span class="tag">公告</span><span class="run" id="pv"></span></div>

  <label for="token">GitHub 令牌</label>
  <input id="token" type="password" autocomplete="off" placeholder="github_pat_…（只保存在本机浏览器）">
  <p class="muted">需要对 sandeli/TGYSTV-notice 仓库有 Contents 读写权限的 Fine-grained token。令牌只存在这台手机的浏览器里，不会上传到别处。</p>

  <button id="save">发布公告</button>
  <button id="load" class="ghost">读取当前公告</button>
  <div id="msg"></div>
</main>
<script>
var REPO='sandeli/TGYSTV-notice',BRANCH='main',PATH='announcement.json';
var API='https://api.github.com/repos/'+REPO+'/contents/'+PATH;
var $=function(id){return document.getElementById(id)};
$('token').value=localStorage.getItem('tgys-notice-token')||'';
function preview(){var parts=[$('text').value.trim()].concat($('more').value.split('\n').map(function(s){return s.trim()})).filter(Boolean);$('pv').textContent=$('enabled').checked?(parts.join('        ◆        ')||'（空）'):'（已隐藏）';}
['text','more','enabled'].forEach(function(id){$(id).addEventListener('input',preview);$(id).addEventListener('change',preview)});
function say(t,cls){$('msg').className=cls||'';$('msg').textContent=t;}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
function unb64(str){return decodeURIComponent(escape(atob(str.replace(/\n/g,''))))}
function headers(){var t=$('token').value.trim();var h={'Accept':'application/vnd.github+json'};if(t)h['Authorization']='Bearer '+t;return h;}
function current(){return fetch(API+'?ref='+BRANCH+'&t='+Date.now(),{headers:headers()}).then(function(r){if(!r.ok)throw new Error('读取失败（HTTP '+r.status+'）');return r.json()});}
function fill(j){$('text').value=j.text||'';$('more').value=(j.messages||[]).join('\n');$('enabled').checked=j.enabled!==false;preview();}
$('load').onclick=function(){say('正在读取…');current().then(function(f){fill(JSON.parse(unb64(f.content)));say('已读取当前公告','ok')}).catch(function(e){say(e.message,'bad')});};
$('save').onclick=function(){
  var t=$('token').value.trim();if(!t){say('请先填写 GitHub 令牌','bad');return;}
  localStorage.setItem('tgys-notice-token',t);
  var now=new Date();var data={enabled:$('enabled').checked,text:$('text').value.trim(),messages:$('more').value.split('\n').map(function(s){return s.trim()}).filter(Boolean),updated:now.toISOString()};
  say('正在发布…');
  current().then(function(f){return f.sha}).catch(function(){return null}).then(function(sha){
    var body={message:'公告更新 '+now.toLocaleString('zh-CN'),content:b64(JSON.stringify(data,null,2)+'\n'),branch:BRANCH};if(sha)body.sha=sha;
    return fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers()),body:JSON.stringify(body)});
  }).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error('发布失败（HTTP '+r.status+'）：'+(j.message||''))});['cdn','fastly'].forEach(function(h){fetch('https://purge.jsdelivr.net/gh/'+REPO+'@'+BRANCH+'/'+PATH).catch(function(){})});say('已发布。电视下次启动 App 时显示（一般几分钟内生效）。','ok');})
  .catch(function(e){say(e.message,'bad')});
};
current().then(function(f){fill(JSON.parse(unb64(f.content)))}).catch(function(){preview()});
</script>
</body>
</html>
