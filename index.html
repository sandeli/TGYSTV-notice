<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TGYS TV · 公告发布</title>
<style>
body{margin:0;background:#0B1426;color:#E6EDF7;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:22px;margin:0 0 4px}h1 b{color:#F97316}
.sub{color:#8A9BB8;font-size:13px;margin:0 0 18px}
label{display:block;margin:16px 0 6px;font-size:14px}
input,textarea{box-sizing:border-box;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #24385E;background:#13203A;color:#E6EDF7;font-size:16px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px}
.row input{width:auto;transform:scale(1.4)}
button{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#F97316;color:#fff;font-size:17px}
button.ghost{background:#1B2B4B}
.preview{margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;overflow:hidden;white-space:nowrap;font-size:15px}
.preview span.tag{background:#F97316;color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:bold;margin-right:10px}
.preview .run{display:inline-block;padding-left:100%;animation:run 14s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
#tgn-msg{margin-top:14px;font-size:14px;white-space:pre-wrap;word-break:break-all}
.ok{color:#34D399}.bad{color:#F87171}.muted{color:#8A9BB8;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>TGYS <b>TV</b> · 公告发布</h1>
  <p class="sub">保存后，电视端每次启动 App 时读取，显示在首页「热门电影」上方的跑马灯里。</p>

  <label for="tgn-text">公告内容</label>
  <textarea id="tgn-text" placeholder="例如：今晚 22:00 起维护半小时"></textarea>

  <label for="tgn-more">更多公告（可选，每行一条，依次滚动）</label>
  <textarea id="tgn-more" style="min-height:70px"></textarea>

  <div class="row"><input type="checkbox" id="tgn-enabled" checked><label for="tgn-enabled" style="margin:0">显示公告（取消勾选即隐藏）</label></div>

  <div class="preview"><span class="tag">公告</span><span class="run" id="tgn-pv"></span></div>

  <label for="tgn-token">GitHub 令牌</label>
  <input id="tgn-token" type="password" autocomplete="off" placeholder="github_pat_…（只保存在本机浏览器）">
  <p class="muted">需要对 sandeli/TGYSTV-notice 仓库有 Contents 读写权限的 Fine-grained token。令牌只存在这台手机的浏览器里，不会上传到别处。</p>

  <button id="tgn-save">发布公告</button>
  <button id="tgn-load" class="ghost">读取当前公告</button>
  <div id="tgn-msg" class="bad">页面脚本未运行：请用 Chrome / Edge / Safari 直接打开本页（不要在 GitHub 代码页或聊天软件内置浏览器里打开）。</div>
</main>
<script>
window.onerror=function(m,u,l){var e=document.getElementById('tgn-msg');if(e){e.className='bad';e.textContent='页面出错：'+m+'（第 '+l+' 行）';}};
var REPO='sandeli/TGYSTV-notice',BRANCH='main',PATH='announcement.json';
var API='https://api.github.com/repos/'+REPO+'/contents/'+PATH;
function $(id){return document.getElementById(id)}
function val(id){var e=$(id);return e&&e.value!=null?String(e.value):''}
function store(k,v){try{if(v===undefined)return window.localStorage.getItem(k)||'';window.localStorage.setItem(k,v)}catch(e){return ''}}
$('tgn-token').value=store('tgys-notice-token');
function lines(){var a=String($('tgn-more').value||'').split('\n'),o=[];for(var i=0;i<a.length;i++){var t=a[i].replace(/^\s+|\s+$/g,'');if(t)o.push(t)}return o}
function trim(s){return String(s==null?'':s).replace(/^\s+|\s+$/g,'')}
function preview(){var p=[];if(trim($('tgn-text').value))p.push(trim($('tgn-text').value));p=p.concat(lines());$('tgn-pv').textContent=$('tgn-enabled').checked?(p.join('        ◆        ')||'（空）'):'（已隐藏）';}
var ids=['tgn-text','tgn-more','tgn-enabled'];for(var k=0;k<ids.length;k++){$(ids[k]).oninput=preview;$(ids[k]).onchange=preview;}
function say(t,cls){$('tgn-msg').className=cls||'';$('tgn-msg').textContent=t;}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
function unb64(str){return decodeURIComponent(escape(atob(str.replace(/\s/g,''))))}
function req(method,url,body,cb){
  var x=new XMLHttpRequest();x.open(method,url,true);
  x.setRequestHeader('Accept','application/vnd.github+json');
  var t=trim($('tgn-token').value);if(t)x.setRequestHeader('Authorization','Bearer '+t);
  if(body)x.setRequestHeader('Content-Type','application/json');
  x.timeout=20000;
  x.onload=function(){var j=null;try{j=JSON.parse(x.responseText)}catch(e){}cb(x.status,j)};
  x.onerror=function(){cb(0,null)};x.ontimeout=function(){cb(-1,null)};
  x.send(body?JSON.stringify(body):null);
}
function errText(st,j){if(st===0)return '连不上 GitHub，请检查网络后再试';if(st===-1)return '连接 GitHub 超时，请再试一次';if(st===401)return '令牌无效或已过期（HTTP 401）';if(st===403||st===404)return '令牌没有这个仓库的写权限（HTTP '+st+'）';return 'HTTP '+st+(j&&j.message?'：'+j.message:'')}
function current(cb){req('GET',API+'?ref='+BRANCH+'&t='+(+new Date()),null,cb)}
function fill(j){$('tgn-text').value=j.text||'';$('tgn-more').value=(j.messages||[]).join('\n');$('tgn-enabled').checked=j.enabled!==false;preview();}
$('tgn-load').onclick=function(){say('正在读取…');current(function(st,f){if(st===200&&f){fill(JSON.parse(unb64(f.content)));say('已读取当前公告','ok')}else say('读取失败：'+errText(st,f),'bad')})};
var busy=false;
$('tgn-save').onclick=function(){
  if(busy)return;
  var t=trim($('tgn-token').value);if(!t){say('请先填写 GitHub 令牌','bad');return;}
  store('tgys-notice-token',t);
  var now=new Date();var data={enabled:$('tgn-enabled').checked,text:trim($('tgn-text').value),messages:lines(),updated:now.toISOString()};
  busy=true;$('tgn-save').textContent='正在发布…';say('正在发布…');
  current(function(st,f){
    var body={message:'公告更新 '+now.toLocaleString(),content:b64(JSON.stringify(data,null,2)+'\n'),branch:BRANCH};if(st===200&&f&&f.sha)body.sha=f.sha;
    req('PUT',API,body,function(st2,j){
      busy=false;$('tgn-save').textContent='发布公告';
      if(st2===200||st2===201){try{var p=new XMLHttpRequest();p.open('GET','https://purge.jsdelivr.net/gh/'+REPO+'@'+BRANCH+'/'+PATH,true);p.send()}catch(e){}
        say('✓ 已发布。电视彻底退出 App 再打开即可看到（一般 1～2 分钟内生效）。','ok');}
      else say('发布失败：'+errText(st2,j),'bad');
    });
  });
};
say('页面已就绪（v4），填好令牌后点「发布公告」','muted');
current(function(st,f){if(st===200&&f){try{fill(JSON.parse(unb64(f.content)))}catch(e){preview()}}else preview()});
</script>
</body>
</html>
